services:
  - type: web
    name: evershop-app
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: ALLOW_CONFIG_MUTATIONS
        value: "true"
      - key: DB_HOST
        fromDatabase:
          name: evershop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: evershop-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: evershop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: evershop-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: evershop-db
          property: database
      - key: DB_SSLMODE
        value: require
    disk:
      name: evershop-media
      mountPath: /app/media
      sizeGB: 5

databases:
  - name: evershop-db
    plan: starter
